name: Verify Java solution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Verify with real PostgreSQL
        run: ./mvnw -B -ntp verify
      - name: Verify clean startup and restart persistence
        working-directory: .
        run: bash scripts/smoke-test.sh
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            java/target/surefire-reports/
            java/target/failsafe-reports/
            java/target/site/jacoco/
            java/target/smoke-*
